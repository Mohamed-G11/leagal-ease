name: CD

# Publishes the API image. It does not deploy anything.
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

# One publish at a time, in order, so that `latest` always ends on the newest commit.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      # GITHUB_TOKEN is provided by GitHub for this run: no secret to create.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lower-cases the image name (ghcr.io rejects capitals) and adds the labels that link it to the repository.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-api
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
