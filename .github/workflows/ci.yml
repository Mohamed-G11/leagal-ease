name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Used only by the migration step. The tests run on SQLite and fakes.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Dummy values: there are no secrets in CI.
    env:
      DATABASE_URL: postgresql+psycopg2://ci:ci@localhost:5432/ci
      SECRET_KEY: ci-dummy-secret-key
      # Any accidental model download fails loudly.
      HF_HUB_OFFLINE: "1"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install --progress-bar off -r requirements-dev.txt

      - name: Check that torch is the CPU build
        run: python -c "import torch; print(torch.__version__); assert torch.__version__.endswith('+cpu')"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -rs

      - name: Migrations on PostgreSQL (upgrade, downgrade, upgrade, no model drift)
        working-directory: backend
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head
          alembic check
