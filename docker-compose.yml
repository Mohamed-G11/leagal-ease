services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: legalease-qdrant
    ports:
      - "127.0.0.1:6333:6333" # REST API + dashboard, local only: no password
      - "127.0.0.1:6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: legalease-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432" # local only; 5433 because a local PostgreSQL install often holds 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: legalease-api:local
    container_name: legalease-api
    # Secrets (SECRET_KEY, GROQ_API_KEY, ...) are read at run time and are never part of the image.
    env_file:
      - path: .env
        required: false
    environment:
      # These override .env, which points at localhost. The user and password go through
      # PGUSER / PGPASSWORD, so special characters need no URL encoding.
      DATABASE_URL: postgresql+psycopg2://@postgres:5432/${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      QDRANT_URL: http://qdrant:6333
      # Plain downloads, and no second copy of the BGE-M3 weights in safetensors format.
      HF_HUB_DISABLE_XET: "1"
      DISABLE_SAFETENSORS_CONVERSION: "1"
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:8000:8000" # local only
    volumes:
      - hf_cache:/home/app/.cache/huggingface
      - api_uploads:/srv/backend/uploads
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  # MCP tools over streamable HTTP. Off by default: docker compose --profile mcp up -d --build mcp
  # It loads its own copy of the embedding model, and has no login: keep it on 127.0.0.1.
  mcp:
    profiles: [mcp]
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: legalease-api:local
    container_name: legalease-mcp
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://@postgres:5432/${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      QDRANT_URL: http://qdrant:6333
    command: python scripts/run_mcp.py --http --host 0.0.0.0 --port 8001
    ports:
      - "127.0.0.1:8001:8001" # local only
    volumes:
      - hf_cache:/home/app/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck: # the image's check asks the API on port 8000
      test: [ "CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8001), 3)" ]
      interval: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend  # the browser calls the API at http://127.0.0.1:8000
    image: legalease-frontend:local
    container_name: legalease-frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      - api
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: legalease-prometheus
    ports:
      - "127.0.0.1:9090:9090" # local only: Prometheus has no login
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.2
    container_name: legalease-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    # Refuse to start with Grafana's default admin password.
    entrypoint: ["sh", "-c", 'if [ -z "$$GF_SECURITY_ADMIN_PASSWORD" ]; then echo "Set GRAFANA_ADMIN_PASSWORD in .env"; exit 1; fi; exec /run.sh']
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: on-failure:3

volumes:
  qdrant_data:
  postgres_data:
  hf_cache:
  api_uploads:
  prometheus_data:
  grafana_data:
