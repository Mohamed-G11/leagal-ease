# E2 — Advanced RAG: query transformation + hybrid multi-query + reranker + compression
name: E2_ablation_rewrite_only

embedding:
  model: BAAI/bge-m3
  batch_size: 16

qdrant:
  path: ./qdrant_local
  collection: legalease_e1   # same index as E1 (dense + bm25): no reindex needed

chunking:
  max_tokens: 500
  overlap_tokens: 50

retrieval:
  mode: hybrid
  top_k: 5
  prefetch_k: 20
  bm25: {k1: 1.2, b: 0.75, avg_len: 256}

query_transform:
  enabled: true
  model: openai/gpt-oss-20b

reranker:
  enabled: false
  model: BAAI/bge-reranker-v2-m3
  candidates_k: 20

compression:
  enabled: false
  min_score: 0.05
  keep_at_least: 1

llm:
  provider: groq
  model: openai/gpt-oss-120b
  temperature: 0.0
  max_tokens: 2048
