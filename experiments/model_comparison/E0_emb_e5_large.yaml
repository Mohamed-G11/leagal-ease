name: E0_emb_e5_large
embedding:
  model: intfloat/multilingual-e5-large
  batch_size: 16
  query_prefix: "query: "
  passage_prefix: "passage: "
qdrant:
  path: ./qdrant_local
  collection: cmp_e5_large
chunking: {max_tokens: 500, overlap_tokens: 50}
retrieval: {top_k: 5}
llm: {provider: groq, model: openai/gpt-oss-120b, temperature: 0.0, max_tokens: 2048}
